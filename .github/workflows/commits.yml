---
name: Commits

on:
  push:
    branches:
      - "**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

env:
  NIX_CONFIG: experimental-features = nix-command flakes

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-nix
      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE
            head=$PR_HEAD
            allow_fixup=$PR_DRAFT
          elif [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            base=$PUSH_BEFORE
            head=$GITHUB_SHA
            allow_fixup=false
          else
            base=origin/$DEFAULT_BRANCH
            head=$GITHUB_SHA
            allow_fixup=true
          fi

          if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            if [ "$EVENT" = pull_request ]; then
              echo "Pull request base $base is not in the clone" >&2
              exit 1
            fi
            base=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          fi

          ALLOW_FIXUP=$allow_fixup nix shell --inputs-from . nixpkgs#convco \
            -c .github/scripts/check-commits.sh "$base..$head"
