---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

env:
  NIX_CONFIG: experimental-features = nix-command flakes

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - name: Check formatting
        run: |
          nix fmt
          git diff --exit-code

  lint-nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - name: Lint Nix
        run: nix run .#lint_nix

  lint-bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - name: Lint shell fragments
        run: nix run .#lint_bash

  lint-editorconfig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - name: Lint files with editorconfig-checker
        run: nix run .#lint_editor

  lint-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-nix
      - name: Lint commit messages
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            from=$PR_BASE
            to=$PR_HEAD
            allow_fixup=$PR_DRAFT
          else
            from=$PUSH_BEFORE
            to=$GITHUB_SHA
            allow_fixup=false
          fi

          if ! git rev-parse --verify --quiet "$from^{commit}" >/dev/null; then
            if [ "$EVENT" = pull_request ]; then
              echo "Pull request base $from is not in the clone" >&2
              exit 1
            fi
            from=
          fi

          flags=()
          if [ "$allow_fixup" = true ]; then
            flags+=(--allow-fixup)
          fi
          nix run .#lint_commits -- "${flags[@]}" --from "$from" --to "$to"

  flake-check:
    needs:
      - format
      - lint-nix
      - lint-bash
      - lint-editorconfig
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
    name: flake-check (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - name: Unit tests
        run: nix build -L ".#checks.${{ matrix.system }}.nix-unit"
      - name: Shell tests
        run: nix build -L ".#checks.${{ matrix.system }}.shell"
      - name: Examples
        run: nix build -L ".#checks.${{ matrix.system }}.examples"
      - name: lets test
        run: nix run .#test
      - name: Other flake checks
        run: nix flake check -L --no-update-lock-file

  build-darwin:
    needs:
      - format
      - lint-nix
      - lint-bash
      - lint-editorconfig
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            system: aarch64-darwin
    name: build-darwin (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - name: Build lets outputs
        run: |
          nix build -L \
            ".#packages.${{ matrix.system }}.lets" \
            ".#packages.${{ matrix.system }}.completions"
      - name: Unit tests
        run: nix build -L ".#checks.${{ matrix.system }}.nix-unit"
      - name: Shell tests
        run: nix build -L ".#checks.${{ matrix.system }}.shell"
      - name: Examples
        run: nix build -L ".#checks.${{ matrix.system }}.examples"
      - name: Completions
        run: nix build -L ".#checks.${{ matrix.system }}.completions"
      - name: Dotenv
        run: nix build -L ".#checks.${{ matrix.system }}.dotenv"
