---
name: CI

on:
  push:
  pull_request:

env:
  NIX_CONFIG: experimental-features = nix-command flakes

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - name: Check formatting
        run: |
          nix fmt
          git diff --exit-code

  lint-nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - name: Lint Nix
        run: nix run .#lint_nix

  lint-bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - name: Lint shell fragments
        run: nix run .#lint_bash

  lint-editorconfig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - name: Lint files with editorconfig-checker
        run: nix run .#lint_editor

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - name: Run unit and example tests
        run: nix run .#test

  flake-check:
    needs:
      - format
      - lint-nix
      - lint-bash
      - lint-editorconfig
      - tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
    name: flake-check (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - name: Run flake checks
        run: nix flake check -L

  build-darwin:
    needs:
      - format
      - lint-nix
      - lint-bash
      - lint-editorconfig
      - tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            system: x86_64-darwin
          - os: macos-latest
            system: aarch64-darwin
    name: build-darwin (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - name: Build lets outputs and run unit tests
        run: |
          nix build -L \
            ".#packages.${{ matrix.system }}.lets" \
            ".#packages.${{ matrix.system }}.completions" \
            ".#checks.${{ matrix.system }}.unit"
